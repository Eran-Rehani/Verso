<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 760" width="380" height="760">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- Phone Frame -->
  <rect x="10" y="10" width="360" height="740" rx="34" fill="#1F2937" filter="url(#shadow)"/>
  <rect x="18" y="18" width="344" height="724" rx="28" fill="#FAFAF7"/>
  <!-- Top Progress Bar (2dp) -->
  <rect x="18" y="18" width="344" height="4" fill="#D9D9D4"/>
  <rect x="18" y="18" width="160" height="4" fill="#1A5FB4"/>

  <!-- Top Reader Chrome Bar -->
  <rect x="18" y="22" width="344" height="58" fill="#FAFAF7"/>
  <line x1="18" y1="80" x2="362" y2="80" stroke="#D9D9D4" stroke-width="1"/>
  <!-- Back Arrow -->
  <text x="34" y="57" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1A1A1A">←</text>
  <!-- Title & Page Subtitle -->
  <text x="64" y="48" font-family="sans-serif" font-size="14" font-weight="700" fill="#1A1A1A">Mathematical Analysis &amp; Physics</text>
  <text x="64" y="65" font-family="sans-serif" font-size="10.5" fill="#6B6B6B">Page 2/5 · 2. Calculus &amp; Gaussian Integrals</text>
  <!-- Action Icons -->
  <circle cx="256" cy="51" r="13" fill="#1A5FB4" fill-opacity="0.12"/>
  <text x="251" y="56" font-family="sans-serif" font-size="13" fill="#1A5FB4">★</text>
  <text x="279" y="56" font-family="sans-serif" font-size="13" fill="#1A1A1A">🔖</text>
  <circle cx="294" cy="42" r="7" fill="#1A5FB4"/>
  <text x="291.5" y="45.5" font-family="monospace" font-size="8.5" font-weight="bold" fill="#FFFFFF">3</text>
  <text x="308" y="56" font-family="sans-serif" font-size="13" fill="#1A1A1A">🔍</text>
  <text x="334" y="56" font-family="sans-serif" font-size="14" fill="#1A1A1A">☰</text>

  <!-- Inline Bookmark Ribbon -->
  <rect x="36" y="96" width="176" height="22" rx="6" fill="#1A5FB4" fill-opacity="0.14"/>
  <text x="46" y="111" font-family="sans-serif" font-size="10.5" font-weight="600" fill="#1A5FB4">★ Page 2 · Key Gaussian Identity</text>

  <!-- Section Heading -->
  <text x="36" y="146" font-family="Georgia, serif" font-size="19" font-weight="bold" fill="#1A1A1A">1. Algebraic Foundations</text>
  <text x="36" y="172" font-family="Georgia, serif" font-size="13.5" fill="#1A1A1A">For any quadratic polynomial</text>
  <text x="218" y="172" font-family="Georgia, serif" font-style="italic" font-size="13.5" fill="#1A1A1A">ax² + bx + c = 0</text>
  <text x="36" y="192" font-family="Georgia, serif" font-size="13.5" fill="#1A1A1A">with coefficients in ℝ, the roots are given by:</text>

  <!-- MathBlock 1: Quadratic Formula -->
  <rect x="36" y="206" width="308" height="68" rx="10" fill="#EFEFEA" stroke="#D9D9D4" stroke-width="1"/>
  <text x="90" y="245" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#1A1A1A">x</text>
  <text x="105" y="245" font-family="Georgia, serif" font-size="16" fill="#1A1A1A">=</text>
  <text x="128" y="231" font-family="Georgia, serif" font-size="14" fill="#1A1A1A">−b ± √(b² − 4ac)</text>
  <line x1="125" y1="239" x2="242" y2="239" stroke="#1A1A1A" stroke-width="1.4"/>
  <text x="175" y="257" font-family="Georgia, serif" font-size="14" fill="#1A1A1A">2a</text>
  <text x="304" y="245" font-family="Georgia, serif" font-size="12.5" fill="#6B6B6B">(1.1)</text>

  <!-- Section 2 Heading -->
  <text x="36" y="306" font-family="Georgia, serif" font-size="19" font-weight="bold" fill="#1A1A1A">2. Gaussian Integrals</text>
  <text x="36" y="330" font-family="Georgia, serif" font-size="13.5" fill="#1A1A1A">The Euler–Poisson integral over the real line ℝ:</text>

  <!-- MathBlock 2: Gaussian Integral -->
  <rect x="36" y="344" width="308" height="72" rx="10" fill="#EFEFEA" stroke="#D9D9D4" stroke-width="1"/>
  <text x="120" y="362" font-family="Georgia, serif" font-size="10" fill="#1A1A1A">∞</text>
  <text x="114" y="388" font-family="Georgia, serif" font-style="italic" font-size="26" fill="#1A1A1A">∫</text>
  <text x="112" y="405" font-family="Georgia, serif" font-size="10" fill="#1A1A1A">−∞</text>
  <text x="136" y="385" font-family="Georgia, serif" font-style="italic" font-size="16" fill="#1A1A1A">e</text>
  <text x="145" y="376" font-family="Georgia, serif" font-size="11" fill="#1A1A1A">−x²</text>
  <text x="170" y="385" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#1A1A1A">dx</text>
  <text x="194" y="385" font-family="Georgia, serif" font-size="16" fill="#1A1A1A">= √π</text>
  <text x="304" y="385" font-family="Georgia, serif" font-size="12.5" fill="#6B6B6B">(2.1)</text>

  <!-- Section 3 Matrix -->
  <text x="36" y="446" font-family="Georgia, serif" font-size="19" font-weight="bold" fill="#1A1A1A">3. Rotation Matrices</text>
  <rect x="36" y="462" width="308" height="78" rx="10" fill="#EFEFEA" stroke="#D9D9D4" stroke-width="1"/>
  <text x="68" y="506" font-family="Georgia, serif" font-style="italic" font-size="15" fill="#1A1A1A">R(θ) =</text>
  <path d="M 126 476 C 118 488, 118 514, 126 526" stroke="#1A1A1A" stroke-width="1.6" fill="none"/>
  <text x="134" y="494" font-family="Georgia, serif" font-size="13.5" fill="#1A1A1A">cos θ</text>
  <text x="184" y="494" font-family="Georgia, serif" font-size="13.5" fill="#1A1A1A">−sin θ</text>
  <text x="134" y="518" font-family="Georgia, serif" font-size="13.5" fill="#1A1A1A">sin θ</text>
  <text x="188" y="518" font-family="Georgia, serif" font-size="13.5" fill="#1A1A1A">cos θ</text>
  <path d="M 228 476 C 236 488, 236 514, 228 526" stroke="#1A1A1A" stroke-width="1.6" fill="none"/>
  <text x="304" y="506" font-family="Georgia, serif" font-size="12.5" fill="#6B6B6B">(3.1)</text>

  <!-- Quote Block -->
  <rect x="36" y="556" width="308" height="58" rx="8" fill="#EFEFEA" fill-opacity="0.7"/>
  <rect x="46" y="566" width="3.5" height="38" rx="2" fill="#1A5FB4"/>
  <text x="60" y="582" font-family="Georgia, serif" font-style="italic" font-size="12.5" fill="#1A1A1A">“All inline and display LaTeX equations are</text>
  <text x="60" y="600" font-family="Georgia, serif" font-style="italic" font-size="12.5" fill="#1A1A1A">typeset natively offline on device.”</text>

  <!-- Bottom Quick TOC & Progress Bar -->
  <rect x="34" y="666" width="312" height="54" rx="14" fill="#FAFAF7" stroke="#D9D9D4" stroke-width="1.2"/>
  <text x="48" y="698" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1A1A1A">‹</text>
  <text x="72" y="689" font-family="sans-serif" font-size="12.5" font-weight="600" fill="#1A1A1A">2. Calculus &amp; Gaussian Integrals</text>
  <text x="72" y="706" font-family="sans-serif" font-size="10.5" fill="#6B6B6B">Page 2/5 · Section 3 of 7</text>
  <text x="282" y="697" font-family="monospace" font-size="12" font-weight="bold" fill="#1A5FB4">45%</text>
  <text x="326" y="698" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1A1A1A">›</text>
</svg>
