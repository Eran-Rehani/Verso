<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 760" width="380" height="760">
  <defs>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <!-- Phone Frame (Dark Theme) -->
  <rect x="10" y="10" width="360" height="740" rx="34" fill="#111827" filter="url(#shadow2)"/>
  <rect x="18" y="18" width="344" height="724" rx="28" fill="#1B1B1D"/>

  <!-- Top Search Chrome Bar -->
  <rect x="18" y="22" width="344" height="58" rx="10" fill="#1B1B1D"/>
  <line x1="18" y1="80" x2="362" y2="80" stroke="#3A3B3F" stroke-width="1"/>
  <text x="30" y="56" font-family="sans-serif" font-size="16" fill="#D6D6D6">←</text>
  <rect x="52" y="33" width="166" height="36" rx="9" fill="#2A2B2E"/>
  <text x="64" y="56" font-family="sans-serif" font-size="13.5" fill="#D6D6D6">Hamiltonian</text>
  <text x="200" y="55" font-family="sans-serif" font-size="12" fill="#9A9A9A">✕</text>
  <text x="226" y="55" font-family="monospace" font-size="11.5" font-weight="bold" fill="#8AB4F8">1/3</text>
  <text x="260" y="56" font-family="sans-serif" font-size="14" fill="#D6D6D6">▲</text>
  <text x="284" y="56" font-family="sans-serif" font-size="14" fill="#D6D6D6">▼</text>
  <text x="312" y="56" font-family="sans-serif" font-size="14" fill="#8AB4F8">☰</text>

  <!-- Underlying Document Content with Active Highlight -->
  <text x="34" y="116" font-family="Georgia, serif" font-size="17" font-weight="bold" fill="#9A9A9A">4. Quantum Mechanics</text>
  <text x="34" y="144" font-family="Georgia, serif" font-size="13" fill="#9A9A9A">evolution under the</text>
  <rect x="150" y="130" width="86" height="19" rx="4" fill="#D97706"/>
  <text x="154" y="144" font-family="Georgia, serif" font-weight="bold" font-size="13" fill="#FFFFFF">Hamiltonian</text>

  <!-- Dim Scrim for Bookmarks Sidebar -->
  <rect x="18" y="80" width="90" height="662" fill="#000000" fill-opacity="0.48"/>

  <!-- Slide-in Right Bookmarks Sidebar Drawer -->
  <rect x="104" y="22" width="258" height="720" rx="18" fill="#1B1B1D" stroke="#3A3B3F" stroke-width="1"/>
  <!-- Sidebar Header -->
  <text x="122" y="54" font-family="sans-serif" font-size="16" font-weight="bold" fill="#D6D6D6">🔖 Bookmarks</text>
  <text x="144" y="71" font-family="sans-serif" font-size="11" fill="#9A9A9A">3 saved pages</text>
  <text x="334" y="56" font-family="sans-serif" font-size="15" fill="#9A9A9A">✕</text>

  <!-- Current Page Quick Bookmark Card -->
  <rect x="118" y="86" width="230" height="58" rx="12" fill="#8AB4F8" fill-opacity="0.14" stroke="#8AB4F8" stroke-width="1"/>
  <text x="130" y="109" font-family="sans-serif" font-size="12.5" font-weight="bold" fill="#D6D6D6">Current: Page 4 of 5</text>
  <text x="130" y="127" font-family="sans-serif" font-size="10.5" fill="#8AB4F8">Bookmarked · Tap to remove</text>

  <!-- Sort Filter Row -->
  <text x="120" y="168" font-family="sans-serif" font-size="11" fill="#9A9A9A">Sort by:</text>
  <rect x="168" y="154" width="64" height="22" rx="8" fill="#8AB4F8"/>
  <text x="179" y="169" font-family="sans-serif" font-size="10.5" font-weight="bold" fill="#1B1B1D">By Page</text>
  <rect x="238" y="154" width="58" height="22" rx="8" fill="#2A2B2E"/>
  <text x="249" y="169" font-family="sans-serif" font-size="10.5" fill="#D6D6D6">Recent</text>

  <!-- Saved Bookmark Card 1 -->
  <rect x="118" y="190" width="230" height="110" rx="12" fill="#2A2B2E" stroke="#3A3B3F" stroke-width="1"/>
  <rect x="128" y="202" width="52" height="20" rx="6" fill="#3A3B3F"/>
  <text x="135" y="216" font-family="monospace" font-size="10" font-weight="bold" fill="#8AB4F8">Page 1</text>
  <text x="188" y="216" font-family="monospace" font-size="10" fill="#9A9A9A">14%</text>
  <text x="302" y="216" font-family="sans-serif" font-size="11" fill="#9A9A9A">✎  🗑</text>
  <text x="128" y="238" font-family="sans-serif" font-size="12" font-weight="600" fill="#D6D6D6">1.1 Binomial Theorem &amp; Series</text>
  <text x="128" y="256" font-family="sans-serif" font-size="11" fill="#8AB4F8">“Review combinatorial proof”</text>
  <text x="128" y="276" font-family="serif" font-size="10.5" fill="#9A9A9A">(x + y)ⁿ = ∑ (n; k) xⁿ⁻ᵏ yᵏ</text>

  <!-- Saved Bookmark Card 2 -->
  <rect x="118" y="312" width="230" height="104" rx="12" fill="#2A2B2E" stroke="#3A3B3F" stroke-width="1"/>
  <rect x="128" y="324" width="52" height="20" rx="6" fill="#3A3B3F"/>
  <text x="135" y="338" font-family="monospace" font-size="10" font-weight="bold" fill="#8AB4F8">Page 2</text>
  <text x="188" y="338" font-family="monospace" font-size="10" fill="#9A9A9A">42%</text>
  <text x="302" y="338" font-family="sans-serif" font-size="11" fill="#9A9A9A">✎  🗑</text>
  <text x="128" y="360" font-family="sans-serif" font-size="12" font-weight="600" fill="#D6D6D6">2. Calculus &amp; Gaussian Integrals</text>
  <text x="128" y="380" font-family="serif" font-size="10.5" fill="#9A9A9A">∫ e⁻ˣ² dx = √π over the real line ℝ</text>

  <!-- Saved Bookmark Card 3 (Active Page) -->
  <rect x="118" y="428" width="230" height="110" rx="12" fill="#8AB4F8" fill-opacity="0.12" stroke="#8AB4F8" stroke-width="1.4"/>
  <rect x="128" y="440" width="52" height="20" rx="6" fill="#8AB4F8"/>
  <text x="135" y="454" font-family="monospace" font-size="10" font-weight="bold" fill="#1B1B1D">Page 4</text>
  <text x="188" y="454" font-family="monospace" font-size="10" fill="#8AB4F8">85%</text>
  <text x="302" y="454" font-family="sans-serif" font-size="11" fill="#9A9A9A">✎  🗑</text>
  <text x="128" y="476" font-family="sans-serif" font-size="12" font-weight="600" fill="#D6D6D6">4. Quantum Mechanics</text>
  <text x="128" y="494" font-family="sans-serif" font-size="11" fill="#8AB4F8">“Schrödinger time-dependent eq”</text>
  <text x="128" y="514" font-family="serif" font-size="10.5" fill="#9A9A9A">iℏ ∂ψ/∂t = (−ℏ²/2m ∇² + V)ψ</text>
</svg>
