<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 760" width="380" height="760">
  <defs>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- Phone Frame (Sepia Theme) -->
  <rect x="10" y="10" width="360" height="740" rx="34" fill="#1F2937" filter="url(#shadow3)"/>
